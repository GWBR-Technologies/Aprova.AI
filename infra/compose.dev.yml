name: aprovaai-dev

# Somente PostgreSQL e Redis para desenvolvimento local, com portas em 127.0.0.1.
# API e Workers rodam na máquina (npm run dev:api e npm run start:worker, em backend/).
# As senhas abaixo valem só para este ambiente descartável e nunca para staging ou produção.
services:
  postgres:
    image: postgres:18.6
    ports: ["127.0.0.1:5432:5432"]
    environment:
      POSTGRES_DB: aprovaai_dev
      POSTGRES_USER: aprova_admin
      POSTGRES_PASSWORD: dev-only
      TZ: UTC
      PGTZ: UTC
    volumes: [pg_dev:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aprova_admin -d aprovaai_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Mesma política da produção: AOF e noeviction.
  redis:
    image: redis:8.2
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes: [redis_dev:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_dev: {}
  redis_dev: {}
